<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>球類報隊系統</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --green: #2a7a38;
      --green-l: #e7f5ea;
      --green-m: #5cb56a;
      --yellow: #d4900a;
      --yellow-l: #fef6e0;
      --blue: #1a5c8a;
      --blue-l: #e3f0fa;
      --red: #b83228;
      --red-l: #fdecea;
      --bg: #f1f6f2;
      --card: #fff;
      --text: #1a2a1c;
      --muted: #7a8f7c;
      --border: #d0e6d3;
      --r: 13px;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      font-family: inherit
    }

    /* ── Header ── */
    header {
      background: var(--green);
      padding: .6rem .85rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      color: #fff;
      letter-spacing: -.02em;
      line-height: 1.15
    }

    .logo em {
      color: #fdd94a;
      font-style: normal
    }

    .logo-sub {
      font-size: .62rem;
      color: rgba(255, 255, 255, .5);
      letter-spacing: .07em
    }

    .hdr-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: flex-end
    }

    .court-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, .13);
      border-radius: 9px;
      padding: 5px 9px
    }

    .court-box label {
      font-size: .75rem;
      color: rgba(255, 255, 255, .85)
    }

    .court-box input {
      width: 36px;
      background: rgba(255, 255, 255, .22);
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 6px;
      color: #fff;
      font-size: .9rem;
      font-weight: 700;
      text-align: center;
      padding: 3px;
      outline: none;
      font-family: inherit
    }

    .court-max-hint {
      font-size: .62rem;
      color: rgba(255, 255, 255, .5)
    }

    .hdr-btn {
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .3);
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: .75rem;
      white-space: nowrap;
      min-height: 34px;
    }

    .hdr-btn:active {
      opacity: .75
    }

    .hdr-btn-gh {
      background: rgba(40, 160, 80, .45);
      border-color: rgba(80, 200, 100, .5)
    }

    .hdr-btn-new {
      background: rgba(220, 80, 60, .35);
      border-color: rgba(255, 120, 100, .4)
    }

    .hdr-btn-print {
      display: none
    }

    /* 手機隱藏列印 */

    #session-badge {
      font-size: .65rem;
      color: rgba(255, 255, 255, .55);
      background: rgba(255, 255, 255, .08);
      border-radius: 5px;
      padding: 2px 7px;
      white-space: nowrap
    }

    /* ── Layout ── */
    .wrap {
      max-width: 1020px;
      margin: 0 auto;
      padding: .85rem .75rem;
      display: flex;
      flex-direction: column;
      gap: .9rem
    }

    .card {
      background: var(--card);
      border-radius: var(--r);
      border: 1px solid var(--border)
    }

    .ch {
      padding: .6rem .95rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 7px
    }

    .ct {
      font-weight: 700;
      font-size: .9rem
    }

    .pill {
      font-size: .63rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--green-l);
      color: var(--green);
      border: 1px solid #aad6b4
    }

    .cb {
      padding: .9rem .95rem
    }

    /* ── Registration ── */
    .reg-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px
    }

    .ni {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: .7rem .9rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: #fafefc;
      outline: none;
      transition: border-color .2s;
      min-height: 46px
    }

    .ni:focus {
      border-color: var(--green-m)
    }

    .add-btn {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: .7rem 1.1rem;
      font-size: .95rem;
      font-weight: 700;
      transition: all .15s;
      width: 100%;
      min-height: 46px
    }

    .add-btn:active {
      background: #1f5e2a
    }

    .csv-btn {
      background: var(--blue-l);
      color: var(--blue);
      border: 1.5px solid #9ec8ea;
      border-radius: 9px;
      padding: .58rem .9rem;
      font-size: .88rem;
      font-weight: 700;
      transition: all .15s;
      width: 100%;
      text-align: center;
      min-height: 44px
    }

    .csv-btn:active {
      background: var(--blue);
      color: #fff
    }

    .csv-hint {
      font-size: .7rem;
      color: var(--muted);
      margin-top: 5px;
      padding: 0 2px
    }

    /* ── Chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 36px
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 5px;
      border-radius: 30px;
      padding: 5px 10px 5px 7px;
      font-size: .82rem;
      font-weight: 600
    }

    .chip-wait {
      background: var(--green-l);
      border: 1px solid #aad6b4;
      color: var(--green)
    }

    .chip-court {
      background: #e8edf5;
      border: 1px solid #b8c8dc;
      color: #4a6880;
      opacity: .72
    }

    .chip-preview {
      background: var(--yellow-l);
      border: 1px solid #e8c870;
      color: #8a6010
    }

    .chip-rk {
      font-size: .6rem;
      color: #fff;
      border-radius: 50%;
      width: 17px;
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0
    }

    .chip-del {
      background: none;
      border: none;
      color: #90ba98;
      font-size: .9rem;
      padding: 2px 0 2px 2px;
      line-height: 1;
      min-width: 22px;
      min-height: 22px
    }

    .chip-del:active {
      color: var(--red)
    }

    .chip-tag {
      font-size: .58rem;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 1px
    }

    .tag-court {
      background: #dce8f5;
      color: var(--blue)
    }

    .tag-prev {
      background: #fdeec0;
      color: #8a6010
    }

    .tag-pin {
      background: #fdeec0;
      color: #8a6010
    }

    .tag-pause {
      background: #eee;
      color: #888
    }

    .chip-excluded {
      opacity: .55;
      filter: grayscale(.5)
    }

    .chip-pin, .chip-pause {
      background: none;
      border: none;
      color: #90ba98;
      font-size: .85rem;
      padding: 2px 0 2px 2px;
      line-height: 1;
      min-width: 22px;
      min-height: 22px
    }

    .chip-pin.active {
      color: var(--yellow)
    }

    .chip-pause.active {
      color: var(--red)
    }

    /* ── Action buttons ── */
    .act-row {
      display: flex;
      gap: 8px
    }

    .btn-shuffle {
      flex: 1;
      background: var(--yellow);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: .8rem .9rem;
      font-size: .95rem;
      font-weight: 900;
      transition: all .15s;
      min-height: 52px;
    }

    .btn-shuffle:active {
      background: #b07808
    }

    .btn-shuffle:disabled {
      opacity: .35;
      cursor: not-allowed
    }

    .btn-release {
      flex: 1;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 11px;
      padding: .8rem .9rem;
      font-size: .95rem;
      font-weight: 900;
      transition: all .15s;
      min-height: 52px;
    }

    .btn-release:active {
      background: #12406a
    }

    .btn-release:disabled {
      opacity: .35;
      cursor: not-allowed
    }

    /* ── Preview ── */
    .prev-list {
      display: flex;
      flex-direction: column;
      gap: 7px
    }

    .prev-match {
      background: var(--yellow-l);
      border: 1px solid #e8c870;
      border-radius: 9px;
      padding: .6rem .9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .prev-court-lbl {
      font-size: .68rem;
      font-weight: 700;
      color: var(--yellow);
      background: #fff;
      border: 1px solid #e8c870;
      border-radius: 5px;
      padding: 2px 7px;
      white-space: nowrap
    }

    .prev-team {
      display: flex;
      gap: 5px;
      flex-wrap: wrap
    }

    .prev-nm {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 3px 9px;
      font-size: .82rem;
      font-weight: 600
    }

    .prev-vs {
      font-size: .7rem;
      color: var(--muted);
      font-weight: 700
    }

    .prev-score {
      font-size: .67rem;
      color: var(--muted);
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 5px;
      padding: 1px 7px;
      white-space: nowrap
    }

    .prev-del {
      background: none;
      border: none;
      color: #c89020;
      font-size: .9rem;
      padding: 2px 4px;
      line-height: 1;
      margin-left: auto;
      min-width: 26px;
      min-height: 26px
    }

    .prev-del:active {
      color: var(--red)
    }

    .prev-left {
      font-size: .77rem;
      color: var(--muted);
      padding: .35rem .7rem;
      background: #f4f4f4;
      border-radius: 7px;
      border: 1px solid #e0e0e0
    }

    /* ── Courts ── */
    .courts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px
    }

    .cc {
      background: var(--blue-l);
      border: 1.5px solid #9ec8ea;
      border-radius: 11px;
      overflow: hidden
    }

    .cc-head {
      background: var(--blue);
      padding: .5rem .85rem;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .cc-title {
      color: #fff;
      font-weight: 700;
      font-size: .88rem
    }

    .cc-time {
      color: rgba(255, 255, 255, .65);
      font-size: .68rem
    }

    .cc-teams {
      padding: .7rem .85rem;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .team-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1
    }

    .team-pl {
      background: #fff;
      border: 1px solid #b8d8f0;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: .85rem;
      font-weight: 600;
      text-align: center
    }

    .vs-div {
      font-size: .7rem;
      font-weight: 900;
      color: var(--blue);
      opacity: .4
    }

    .cc-acts {
      padding: .5rem .85rem;
      border-top: 1px solid #b8d8f0;
      display: flex;
      gap: 6px
    }

    .btn-wa,
    .btn-wb {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: .5rem .4rem;
      font-size: .78rem;
      font-weight: 700;
      transition: all .15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 46px;
    }

    .btn-wa {
      background: var(--green-l);
      color: var(--green);
      border: 1px solid #aad6b4
    }

    .btn-wa:active {
      background: var(--green);
      color: #fff
    }

    .btn-wb {
      background: var(--red-l);
      color: var(--red);
      border: 1px solid #e0aaa8
    }

    .btn-wb:active {
      background: var(--red);
      color: #fff
    }

    .btn-no {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: .5rem .7rem;
      font-size: .72rem;
      background: #f7f7f7;
      color: var(--muted);
      min-height: 46px
    }

    .btn-no:active {
      background: #eee
    }

    /* ── Leaderboard ── */
    .lb {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .lb-hd {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 24px 24px 30px 34px 32px;
      gap: 3px;
      padding: 4px 8px;
      font-size: .62rem;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .lb-row {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) 24px 24px 30px 34px 32px;
      gap: 3px;
      align-items: center;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: .83rem;
      transition: background .15s;
    }

    .lb-row:active {
      background: #f3fbf4
    }

    .lbr {
      font-weight: 700;
      font-size: .77rem;
      text-align: center;
      color: var(--muted)
    }

    .lbr.g1 {
      color: #b8860b;
      font-size: .9rem
    }

    .lbr.g2 {
      color: #888;
      font-size: .9rem
    }

    .lbr.g3 {
      color: #9a6030;
      font-size: .9rem
    }

    .lbn {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0
    }

    .lbn .lbn-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0
    }

    .lbn .oc {
      font-size: .56rem;
      color: var(--blue);
      background: var(--blue-l);
      border-radius: 3px;
      padding: 1px 4px;
      white-space: nowrap
    }

    .lbn .low-sample {
      font-size: .68rem;
      flex-shrink: 0;
      cursor: help
    }

    .lb-note {
      font-size: .68rem;
      color: var(--muted);
      padding: 6px 8px 2px;
    }

    .lbw {
      color: var(--green);
      font-weight: 700;
      text-align: center
    }

    .lbl {
      color: var(--red);
      font-weight: 700;
      text-align: center
    }

    .lbt {
      color: var(--muted);
      text-align: center;
      font-size: .78rem
    }

    .lbwr {
      text-align: center;
      font-size: .8rem;
      font-weight: 700
    }

    .lbscore {
      text-align: center;
      font-size: .8rem;
      font-weight: 700;
      color: var(--blue)
    }

    /* ── History ── */
    .hist-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 50vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch
    }

    .hi {
      background: #fafafa;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: .52rem .88rem;
      font-size: .82rem
    }

    .hi-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      gap: 6px
    }

    .hi-court {
      font-weight: 700;
      color: var(--blue);
      white-space: nowrap
    }

    .hi-time {
      color: var(--muted);
      font-size: .65rem;
      text-align: right
    }

    .hi-match {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap
    }

    .hi-team {
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    .hi-nm {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 2px 7px;
      font-weight: 500
    }

    .hi-win {
      background: var(--green-l);
      border-color: #aad6b4;
      color: var(--green);
      font-weight: 700
    }

    .hi-vs {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 700
    }

    .hi-res {
      font-size: .68rem;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap
    }

    .hi-edit {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #ddd
    }

    .hi-edit .btn-wa,
    .hi-edit .btn-wb,
    .hi-edit .btn-no {
      min-height: 34px;
      padding: .35rem .4rem;
      font-size: .68rem;
      opacity: .6
    }

    .hi-edit .hi-cur {
      opacity: 1;
      outline: 2px solid currentColor
    }

    /* ── Toast ── */
    .notif {
      position: fixed;
      bottom: calc(1.2rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a2a1c;
      color: #fff;
      padding: .55rem 1.1rem;
      border-radius: 9px;
      font-size: .85rem;
      font-weight: 600;
      z-index: 999;
      transition: transform .28s;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .28);
      max-width: 90vw;
      text-align: center;
    }

    .notif.show {
      transform: translateX(-50%) translateY(0)
    }

    .empty {
      color: var(--muted);
      font-size: .83rem;
      text-align: center;
      padding: 1.3rem
    }

    /* ── 桌機：≥ 600px ── */
    @media(min-width:600px) {
      .wrap {
        padding: 1.1rem .9rem;
        gap: 1.1rem
      }

      .reg-row {
        flex-direction: row
      }

      .ni {
        min-width: 130px
      }

      .add-btn {
        width: auto
      }

      .courts-grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr))
      }

      .lb-hd,
      .lb-row {
        grid-template-columns: 30px 1fr 50px 50px 52px 56px 56px
      }

      .hist-list {
        max-height: 320px
      }

      .hdr-btn-print {
        display: inline-flex;
        align-items: center
      }

      .btn-wa,
      .btn-wb {
        font-size: .73rem
      }
    }

    /* ── Print ── */
    @media print {

      header,
      .act-row,
      #preview-card,
      .hist-list,
      .card:not(#lb-card) {
        display: none !important
      }

      body {
        background: #fff
      }

      #lb-card {
        border: none;
        box-shadow: none
      }

      .lb-print-title {
        display: block !important
      }

      .lb-hd,
      .lb-row {
        grid-template-columns: 30px 1fr 50px 50px 52px 56px 56px
      }
    }

    .lb-print-title {
      display: none;
      font-size: 1.1rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: .6rem;
      letter-spacing: .05em
    }
  </style>
</head>

<body>

  <header>
    <div onclick="logoTap()" style="cursor:default;user-select:none">
      <div class="logo">🥒 Pickle<em>Ball</em></div>
      <div class="logo-sub">報隊配對系統</div>
    </div>
    <div class="hdr-right">
      <span id="session-badge"
        style="font-size:.7rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.1);border-radius:6px;padding:3px 9px;white-space:nowrap"></span>
      <div class="court-box">
        <label>模式</label>
        <button id="mode-btn" onclick="toggleMode()"
          style="background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:6px;color:#fff;font-size:.82rem;font-weight:700;padding:3px 10px;cursor:pointer;min-height:28px">雙打</button>
      </div>
      <div class="court-box">
        <label>場地數</label>
        <input type="number" id="court-count" min="1" max="10" value="2">
        <span class="court-max-hint">場</span>
      </div>
      <button class="hdr-btn" onclick="exportCSV()">💾 下載CSV</button>
      <button class="hdr-btn hdr-btn-gh" id="btn-gh" onclick="pushToGitHub()">☁️ 推送GitHub</button>
      <button class="hdr-btn hdr-btn-print" onclick="window.print()">🖨 列印</button>
      <button class="hdr-btn hdr-btn-new" onclick="newSession()">🆕 新比賽</button>
    </div>
  </header>

  <div id="admin-modal"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center">

      style="background:#fff;border-radius:14px;padding:1.4rem 1.5rem;width:min(92vw,420px);box-shadow:0 8px 32px rgba(0,0,0,.25)">

          開頭）</label>

          style="width:100%;border:1.5px solid #cde;border-radius:8px;padding:.5rem .75rem;font-size:.88rem;margin-bottom:.75rem;outline:none;font-family:inherit">

          <button onclick="adminSave()"
            style="border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.85rem;cursor:pointer;background:#2a7a38;color:#fff;font-weight:700;font-family:inherit">加密儲存</button>
        </div>

  <!-- 推送密碼輸入 Modal -->
  <div id="pw-modal"
    style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center">
    <div
      style="background:#fff;border-radius:14px;padding:1.3rem 1.4rem;width:min(88vw,360px);box-shadow:0 8px 28px rgba(0,0,0,.22)">
      <div style="font-weight:800;font-size:.95rem;margin-bottom:.8rem;color:#1a2a1c">☁️ 輸入推送密碼</div>
      <input id="push-pw" type="password" placeholder="推送密碼"
        style="width:100%;border:1.5px solid #cde;border-radius:8px;padding:.55rem .8rem;font-size:1rem;margin-bottom:.9rem;outline:none;font-family:inherit"
        onkeydown="if(event.key==='Enter')confirmPush()">
      <div id="pw-err" style="font-size:.75rem;color:#c0392b;margin-bottom:.6rem;display:none">密碼錯誤，請再試一次</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button onclick="document.getElementById('pw-modal').style.display='none'"
          style="border:1px solid #ccc;border-radius:8px;padding:.45rem .9rem;font-size:.85rem;cursor:pointer;background:#f5f5f5;font-family:inherit">取消</button>
        <button onclick="confirmPush()"
          style="border:none;border-radius:8px;padding:.45rem 1.1rem;font-size:.85rem;cursor:pointer;background:#1a5c8a;color:#fff;font-weight:700;font-family:inherit">確認推送</button>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════
    //  STATE
    //  player: { id, name, joinTime, zone:'new'|'win'|'lose',
    //            matchCount, wins, losses,
    //            teammates:[id], opponents:[id],
    //            pinned:bool (指定優先上場), excluded:bool (暫停上場) }
    //  court:  { id, courtNum, teamA:[p,p], teamB:[p,p], startTime }
    //  hist:   { ...court, endTime, winner:'A'|'B'|null }
    //  preview:[ { courtNum, teamA:[p,p], teamB:[p,p], score } ]
    // ═══════════════════════════════════════════════════════
    let players = [], courts = [], history = [], preview = [], nextId = 1, pinSeq = 0
    let sessionId = '', sessionStart = ''
    let gameMode = 'doubles' // 'doubles' | 'singles'

    const uid = () => nextId++
    const now = () => new Date()
    // 日期可能來自舊版 localStorage（字串而非 Date），先強制轉回 Date 再格式化
    const asDate = v => v instanceof Date ? v : new Date(v)
    const fmt = d => { const x = asDate(d); return isNaN(x) ? '' : x.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) }
    const fmtF = d => { const x = asDate(d); return isNaN(x) ? '' : x.toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' }) + ' ' + fmt(x) }

    function toast(msg) {
      const el = document.getElementById('notif')
      el.textContent = msg; el.classList.add('show')
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2400)
    }

    // ═══════════════════════════════════════════════════════
    //  SESSION ID
    // ═══════════════════════════════════════════════════════
    function genId() {
      const d = new Date()
      const pad = n => String(n).padStart(2, '0')
      const date = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`
      const rand = Math.random().toString(36).slice(2, 6).toUpperCase()
      return `${date}-${rand}`
    }

    function updateSessionBadge() {
      const el = document.getElementById('session-badge')
      if (el) el.textContent = `📁 ${sessionId}　${sessionStart}`
    }

    // ═══════════════════════════════════════════════════════
    //  PERSIST: localStorage  (日期轉 ISO string 存，讀回轉 Date)
    // ═══════════════════════════════════════════════════════
    function dateReplacer(_, v) { return v instanceof Date ? { __date: v.toISOString() } : v }
    function dateReviver(_, v) { return v && v.__date ? new Date(v.__date) : v }

    function saveState() {
      try {
        const snapshot = {
          players, courts, history, nextId, sessionId, sessionStart,
          courtCount: document.getElementById('court-count').value, gameMode
        }
        localStorage.setItem('pb_state', JSON.stringify(snapshot, dateReplacer))
      } catch (e) { console.warn('saveState failed', e) }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem('pb_state')
        if (!raw) return false
        const s = JSON.parse(raw, dateReviver)
        players = s.players || []
        players.forEach(p => {
          if (p.pinOrder === undefined) p.pinOrder = null
          delete p.pinned // 舊版布林旗標改用 pinOrder（null=未指定，數字=指定順序），無法還原順序故直接清除
          if (p.excluded === undefined) p.excluded = false
          if (p.consecutivePlay === undefined) p.consecutivePlay = 0
          if (p.consecutiveRest === undefined) p.consecutiveRest = 0
        })
        pinSeq = players.reduce((mx, p) => Math.max(mx, p.pinOrder || 0), 0)
        courts = s.courts || []
        history = s.history || []
        nextId = s.nextId || 1
        sessionId = s.sessionId || genId()
        sessionStart = s.sessionStart || fmtF(now())
        if (s.courtCount) document.getElementById('court-count').value = s.courtCount
        if (s.gameMode) { gameMode = s.gameMode; document.getElementById('mode-btn').textContent = gameMode === 'singles' ? '單打' : '雙打' }
        return players.length > 0 || history.length > 0
      } catch (e) { return false }
    }

    function newSession() {
      if ((players.length > 0 || history.length > 0) &&
        !confirm('確定要開始新比賽？目前記錄將清除（可先匯出 CSV）')) return
      localStorage.removeItem('pb_state')
      players = []; courts = []; history = []; preview = []; nextId = 1
      sessionId = genId()
      sessionStart = fmtF(now())
      saveState()
      updateSessionBadge()
      renderAll()
      toast('🆕 新比賽開始！代號：' + sessionId)
    }

    // ═══════════════════════════════════════════════════════
    //  EXPORT CSV  (下載到本機)
    // ═══════════════════════════════════════════════════════
    function exportCSV() {
      const csv = buildCSVContent()
      const a = document.createElement('a')
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }))
      a.download = `pickleball_${sessionId}.csv`
      a.click()
      toast('💾 已下載 ' + a.download)
    }

    // ═══════════════════════════════════════════════════════
    //  REGISTER
    // ═══════════════════════════════════════════════════════
    function addPlayer() {
      const inp = document.getElementById('name-input')
      const raw = inp.value.trim()
      if (!raw) { toast('請輸入姓名'); return }
      const names = raw.split(/[,，、\s]+/).map(n => n.trim()).filter(n => n.length > 0)
      if (!names.length) { toast('請輸入姓名'); return }
      let added = 0, dups = []
      names.forEach(name => {
        if (players.find(p => p.name === name)) { dups.push(name); return }
        players.push({
          id: uid(), name, joinTime: now(), zone: 'new',
          matchCount: 0, wins: 0, losses: 0, teammates: [], opponents: [],
          pinOrder: null, excluded: false, consecutivePlay: 0, consecutiveRest: 0
        })
        added++
      })
      inp.value = ''; inp.focus(); preview = []; renderAll()
      if (!added) { toast(`「${dups.join('、')}」已在名單`); return }
      const addedNames = names.filter(n => !dups.includes(n))
      const msg = added > 1 ? `✅ 加入 ${added} 人：${addedNames.join('、')}` : `✅ ${addedNames[0]} 已報名（新進）`
      toast(dups.length ? msg + `（${dups.join('、')} 重複跳過）` : msg)
    }
    document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer() })

    // ═══════════════════════════════════════════════════════
    //  LOAD FROM CSV
    // ═══════════════════════════════════════════════════════
    function loadCSV() {
      const url = './players.csv?t=' + Date.now() // 避免快取
      toast('⏳ 載入中...')
      fetch(url)
        .then(r => {
          if (!r.ok) throw new Error('找不到 players.csv（HTTP ' + r.status + '）')
          return r.text()
        })
        .then(text => {
          const names = text
            .split(/[\r\n]+/)         // 每行切開
            .flatMap(line => line.split(/[,，、]+/)) // 同行逗號也支援
            .map(n => n.trim())
            .filter(n => n.length > 0 && !n.toLowerCase().startsWith('name')) // 跳過標題行
          if (!names.length) { toast('CSV 內容為空'); return }
          let added = 0, dups = 0
          names.forEach(name => {
            if (players.find(p => p.name === name)) { dups++; return }
            players.push({ id: uid(), name, joinTime: now(), zone: 'new', matchCount: 0, wins: 0, losses: 0, teammates: [], opponents: [], pinOrder: null, excluded: false, consecutivePlay: 0, consecutiveRest: 0 })
            added++
          })
          preview = []; renderAll()
          toast(`✅ 載入 ${added} 人${dups ? '（' + dups + ' 人重複跳過）' : ''}`)
        })
        .catch(err => toast('❌ ' + err.message))
    }

    function removePlayer(id) {
      players = players.filter(p => p.id !== id); preview = []; renderAll()
    }

    // saveState 也在 addPlayer / loadCSV 結尾呼叫，由 renderAll 統一處理

    // ═══════════════════════════════════════════════════════
    //  MODE TOGGLE
    // ═══════════════════════════════════════════════════════
    function toggleMode() {
      if (courts.length > 0) { toast('有場地進行中，無法切換模式'); return }
      gameMode = gameMode === 'doubles' ? 'singles' : 'doubles'
      document.getElementById('mode-btn').textContent = gameMode === 'singles' ? '單打' : '雙打'
      preview = []; renderAll()
      toast(gameMode === 'doubles' ? '🔀 切換為雙打模式（2v2）' : '👤 切換為單打模式（1v1）')
    }

    // ═══════════════════════════════════════════════════════
    //  SHUFFLE ALGORITHM
    // ═══════════════════════════════════════════════════════
    function rnd(arr) {
      const a = [...arr]
      for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]] }
      return a
    }

    // 累計勝率（沒打過的人視為中間值0.5），用完整歷史紀錄判斷實力，
    // 而不是只看上一場輸贏——單場運氣不該左右分類
    const winRate = p => p.matchCount > 0 ? p.wins / p.matchCount : 0.5
    const countId = (arr, id) => arr.reduce((n, x) => x === id ? n + 1 : n, 0)

    // 這組人（不分隊型，只看是不是同一批人）在歷史紀錄中一起打過幾次
    function groupRepeatCount(grp) {
      const ids = new Set(grp.map(p => p.id))
      return history.filter(h => {
        const hids = new Set([...h.teamA, ...h.teamB].map(p => p.id))
        return hids.size === ids.size && [...ids].every(id => hids.has(id))
      }).length
    }

    // 評估一種分法：teamA=[a,b] vs teamB=[c,d]
    function splitOption(a, b, c, d) {
      const tmCost = countId(a.teammates, b.id) + countId(c.teammates, d.id)
      let opCost = 0
      for (const x of [a, b]) for (const y of [c, d]) opCost += countId(x.opponents, y.id)
      const balanceCost = Math.abs((winRate(a) + winRate(b)) - (winRate(c) + winRate(d)))
      return { teamA: [a, b], teamB: [c, d], tmCost, opCost, balanceCost, score: tmCost * 2 + opCost }
    }

    // 4人恰好只有3種分法：(01)(23) (02)(13) (03)(12)。
    // 依序比較：優先避免重複搭檔 → 其次避免重複對手 → 最後平衡兩隊總勝率
    function bestSplit(four) {
      const [a, b, c, d] = four
      const opts = [
        splitOption(a, b, c, d),
        splitOption(a, c, b, d),
        splitOption(a, d, b, c),
      ]
      opts.sort((x, y) => x.tmCost - y.tmCost || x.opCost - y.opCost || x.balanceCost - y.balanceCost)
      const best = opts[0]
      const top = opts.filter(o => o.tmCost === best.tmCost && o.opCost === best.opCost && o.balanceCost === best.balanceCost)
      // 完全同分的選項隨機挑，避免固定偏向同一種排列
      return rnd(top)[0]
    }

    // 指定上場：依「點擊順序」記錄，順序決定隊友/對手怎麼分——例如依序點
    // 1,2,3,4，配對時就是隊友1+2 對打隊友3+4。指定者無條件上場，不受
    // 任何輪休規則限制。
    function togglePin(id) {
      const p = players.find(p => p.id === id); if (!p) return
      if (p.pinOrder != null) {
        p.pinOrder = null
        toast(`已取消指定 ${p.name}`)
      } else {
        p.pinOrder = ++pinSeq
        p.excluded = false
        toast(`📌 ${p.name} 指定上場（第 ${players.filter(x => x.pinOrder != null).length} 位）`)
      }
      renderAll()
    }

    function toggleExclude(id) {
      const p = players.find(p => p.id === id); if (!p) return
      p.excluded = !p.excluded
      if (p.excluded) p.pinOrder = null
      else { p.consecutivePlay = 0; p.consecutiveRest = 0 } // 暫停期間視同休息，恢復時重新起算連續場次
      renderAll()
      toast(p.excluded ? `⏸ ${p.name} 暫停上場` : `▶ ${p.name} 恢復上場`)
    }

    function doShuffle() {
      const maxCourts = Math.min(10, parseInt(document.getElementById('court-count').value) || 2)
      const onCourtIds = new Set(courts.flatMap(c => [...c.teamA, ...c.teamB].map(p => p.id)))
      const waiting = players.filter(p => !onCourtIds.has(p.id) && !p.excluded)
      const slots = maxCourts - courts.length
      const grpSz = gameMode === 'singles' ? 2 : 4

      if (slots <= 0) { toast('場地已滿'); return }
      if (waiting.length < grpSz) { toast(`可上場人數不足（需至少 ${grpSz} 人，暫停者不計入）`); return }

      const newPreview = []
      const usedNums = new Set(courts.map(c => c.courtNum))
      const nextNum = () => { let n = 1; while (usedNums.has(n)) n++; usedNums.add(n); return n }

      // ── 指定上場（依點擊順序）：湊滿一整組（雙打4人/單打2人）的，直接依
      //    點擊順序拆隊——前半 vs 後半（例：依序點1,2,3,4＝隊友1+2 對打
      //    隊友3+4），不經過強弱分組或 bestSplit 重新配對。指定者無條件
      //    上場，不受任何輪休規則限制；只受場地數量限制。
      const pinnedOrdered = waiting.filter(p => p.pinOrder != null).sort((a, b) => a.pinOrder - b.pinOrder)
      const usedPinnedIds = new Set()
      let slotsLeft = slots
      for (let i = 0; i + grpSz <= pinnedOrdered.length && slotsLeft > 0; i += grpSz) {
        const grp = pinnedOrdered.slice(i, i + grpSz)
        const half = grpSz / 2
        const teamA = grp.slice(0, half), teamB = grp.slice(half)
        const score = gameMode === 'singles'
          ? countId(teamA[0].opponents, teamB[0].id)
          : splitOption(teamA[0], teamA[1], teamB[0], teamB[1]).score
        newPreview.push({ courtNum: nextNum(), teamA, teamB, score })
        grp.forEach(p => { usedPinnedIds.add(p.id); p.pinOrder = null }) // 指定上場只生效一次，組成後立即清除
        slotsLeft--
      }
      // 湊不成整組的指定剩餘者，優先權留到下面一起處理（依然無條件上場）
      const pinnedLeftover = pinnedOrdered.filter(p => !usedPinnedIds.has(p.id))
      const remainingWaiting = waiting.filter(p => !usedPinnedIds.has(p.id))

      const maxCapacity = Math.min(slotsLeft * grpSz, Math.floor(remainingWaiting.length / grpSz) * grpSz)
      if (maxCapacity < grpSz) {
        if (newPreview.length) { preview = newPreview; renderAll(); toast(`🎯 已產生 ${newPreview.length} 場預覽（指定上場），確認後釋出`); return }
        toast(`無法組成完整對戰（等待人數需為 ${grpSz} 的倍數）`); return
      }

      // ── 依「總人數 vs. 場地總容納量」決定這輪的輪休規則：
      //    人數 < 容納量兩倍：人不夠讓大家每輪都休息，允許連續上場，
      //      但原則上不得連續上場三輪（最多連兩場，第三輪強制休息）。
      //    人數 ≥ 容納量兩倍：人手充足，上一輪有上場的這輪原則上全部
      //      休息（嚴格輪替），同時也不得連續休息三輪，優先讓休最久、
      //      場次最少的人（含新加入者）優先補上。
      const totalCapacity = maxCourts * grpSz
      const totalPeople = players.filter(p => !p.excluded).length
      const lowPopulation = totalPeople < totalCapacity * 2

      const eligiblePool = lowPopulation
        ? remainingWaiting.filter(p => p.pinOrder == null && (p.consecutivePlay || 0) < 2)
        : remainingWaiting.filter(p => p.pinOrder == null && (p.consecutivePlay || 0) === 0)
      const restrictedPool = remainingWaiting.filter(p => p.pinOrder == null && !eligiblePool.includes(p))

      // 排序：（高人數模式下）已連續休息2輪、再不排就會違反「不得連續休三輪」
      //   的人最優先；其餘依「總上場次數」少者優先，次數相同時「已休息越久」
      //   者優先，再相同則隨機，避免同一人總是墊底
      const sortByFairness = arr => rnd(arr).sort((a, b) => {
        if (!lowPopulation) {
          const ma = (a.consecutiveRest || 0) >= 2 ? 0 : 1
          const mb = (b.consecutiveRest || 0) >= 2 ? 0 : 1
          if (ma !== mb) return ma - mb
        }
        if (a.matchCount !== b.matchCount) return a.matchCount - b.matchCount
        return (b.consecutiveRest || 0) - (a.consecutiveRest || 0)
      })

      let candidates = [...pinnedLeftover, ...sortByFairness(eligiblePool)]
      let playCapacity = Math.min(maxCapacity, Math.floor(candidates.length / grpSz) * grpSz)
      let brokeRestRule = false

      // 嚴格遵守輪休規則若導致這輪連一場都開不成（有人在候補，場地卻完全沒人可上），
      // 寧可破例也不要讓場地閒置——讓連續上場次數最接近規則上限的人優先回來遞補，
      // 但只補到「至少能開一場」為止，不會因此整批解禁
      if (playCapacity < grpSz && restrictedPool.length > 0) {
        const extra = rnd(restrictedPool).sort((a, b) => (a.consecutivePlay || 0) - (b.consecutivePlay || 0))
        candidates = [...candidates, ...extra]
        playCapacity = Math.min(maxCapacity, Math.floor(candidates.length / grpSz) * grpSz)
        brokeRestRule = true
      }

      if (playCapacity < grpSz) {
        if (newPreview.length) { preview = newPreview; renderAll(); toast(`🎯 已產生 ${newPreview.length} 場預覽（指定上場），確認後釋出`); return }
        toast(`可上場人數不足（需至少 ${grpSz} 人）`); return
      }
      const restNote = brokeRestRule ? '（可輪替人數不足，已暫時放寬連續上場限制）'
        : playCapacity < maxCapacity ? '（依輪休制度限制，這輪少開一場）' : ''

      const active = candidates.slice(0, playCapacity)

      // ── 實力分組：上面已經公平選出「這一輪誰能上場」，這一步只決定
      //    這群人怎麼互相配對。直接依「累計勝率」由高到低排序，然後照名次
      //    切成一組一組（前面幾名一組、接下來幾名一組……），確保同一組內
      //    的人實力最接近。組內的隊友/對手搭配再交給 bestSplit，在這組固定
      //    的人裡優先避免重複搭檔、其次避免重複對手、最後平衡兩隊總勝率。
      const ranked = [...active].sort((a, b) => winRate(b) - winRate(a))
      const groups = []
      for (let i = 0; i < ranked.length; i += grpSz) groups.push(ranked.slice(i, i + grpSz))

      // 安全閥：同一批人（不分隊型）最近已經配過 ≥2 次，就跳過嚴格名次分組，
      // 改跟名次相鄰的組交換一位成員，找重複度更低的組合——避免實力太接近、
      // 名次久久不變時，同一群人被鎖死一直對打
      for (let gi = 0; gi < groups.length; gi++) {
        if (groupRepeatCount(groups[gi]) < 2) continue
        const neighbors = [gi - 1, gi + 1].filter(ni => ni >= 0 && ni < groups.length)
        let bestSwap = null
        for (const ni of neighbors) {
          const originalCombined = groupRepeatCount(groups[gi]) + groupRepeatCount(groups[ni])
          for (let a = 0; a < groups[gi].length; a++) {
            for (let b = 0; b < groups[ni].length; b++) {
              const g1 = groups[gi].slice(), g2 = groups[ni].slice()
              ;[g1[a], g2[b]] = [g2[b], g1[a]]
              const combined = groupRepeatCount(g1) + groupRepeatCount(g2)
              if (combined < originalCombined && (!bestSwap || combined < bestSwap.combined)) {
                bestSwap = { ni, g1, g2, combined }
              }
            }
          }
        }
        if (bestSwap) {
          groups[gi] = bestSwap.g1
          groups[bestSwap.ni] = bestSwap.g2
        }
      }

      for (const grp of groups) {
        let match
        if (gameMode === 'singles') {
          const [a, b] = grp
          const score = countId(a.opponents, b.id)
          match = { courtNum: nextNum(), teamA: [a], teamB: [b], score }
        } else {
          const { teamA, teamB, score } = bestSplit(grp)
          match = { courtNum: nextNum(), teamA, teamB, score }
        }
        newPreview.push(match)
      }

      // 剩餘湊不成整組的指定者，這輪也已上場，清除指定旗標
      pinnedLeftover.forEach(p => { p.pinOrder = null })

      preview = newPreview; renderAll(); toast(`🎯 已產生 ${newPreview.length} 場預覽，確認後釋出${restNote}`)
    }

    // ═══════════════════════════════════════════════════════
    //  RELEASE TO COURT
    // ═══════════════════════════════════════════════════════
    function doRelease() {
      if (!preview.length) { toast('請先打亂預覽'); return }

      // 更新「連續上場次數」與「連續休息次數」——依這次配對當下的等候名單，
      // 跟實際被排進預覽的人比對：有上場的累加連續上場、連續休息歸零；
      // 沒被排入的累加連續休息、連續上場歸零，供下一輪判斷用
      const onCourtIdsBefore = new Set(courts.flatMap(c => [...c.teamA, ...c.teamB].map(p => p.id)))
      const previewIds = new Set(preview.flatMap(m => [...m.teamA, ...m.teamB].map(p => p.id)))
      players.filter(p => !onCourtIdsBefore.has(p.id) && !p.excluded).forEach(p => {
        if (previewIds.has(p.id)) { p.consecutivePlay = (p.consecutivePlay || 0) + 1; p.consecutiveRest = 0 }
        else { p.consecutiveRest = (p.consecutiveRest || 0) + 1; p.consecutivePlay = 0 }
      })

      preview.forEach(m => {
        courts.push({ id: uid(), courtNum: m.courtNum, teamA: m.teamA, teamB: m.teamB, startTime: now() })
          // Increment match count
          ;[...m.teamA, ...m.teamB].forEach(p => p.matchCount++)
        // Record teammates (bidirectional, each pair once — used as a repeat *count*, not just a flag)
        const recordTeam = team => {
          for (let i = 0; i < team.length; i++) for (let j = i + 1; j < team.length; j++) {
            team[i].teammates.push(team[j].id)
            team[j].teammates.push(team[i].id)
          }
        }
        recordTeam(m.teamA); recordTeam(m.teamB)
        // Record opponents (bidirectional, each pair once)
        m.teamA.forEach(p => m.teamB.forEach(q => {
          p.opponents.push(q.id)
          q.opponents.push(p.id)
        }))
      })
      preview = []; renderAll(); toast(`▶ 已釋出 ${courts.length} 場！`)
    }

    // ═══════════════════════════════════════════════════════
    //  RECORD RESULT
    // ═══════════════════════════════════════════════════════
    function recordResult(courtId, winner) {
      const idx = courts.findIndex(c => c.id === courtId); if (idx === -1) return
      const c = courts[idx]
      if (winner === 'A') {
        c.teamA.forEach(p => { p.wins++; p.zone = 'win' })
        c.teamB.forEach(p => { p.losses++; p.zone = 'lose' })
      } else if (winner === 'B') {
        c.teamB.forEach(p => { p.wins++; p.zone = 'win' })
        c.teamA.forEach(p => { p.losses++; p.zone = 'lose' })
      }
      history.unshift({ ...c, endTime: now(), winner })
      courts.splice(idx, 1)
      const wt = winner === 'A' ? c.teamA : winner === 'B' ? c.teamB : null
      toast(wt ? `🏆 ${wt.map(p => p.name).join(' & ')} 獲勝！` : `場地 ${c.courtNum} 結束（不計分）`)
      renderAll()
    }

    // 修正最近一場的結果（按錯獲勝組別時用）。只開放修正最新一筆，
    // 因為再往前的紀錄，選手的 zone 可能已經被更新的比賽覆蓋過，貿然回改會弄亂目前的分區狀態
    function editResult(historyId, newWinner) {
      const h = history[0]
      if (!h || h.id !== historyId) { toast('只能修正最近一場的結果'); return }
      if (h.winner === newWinner) return

      if (h.winner === 'A') { h.teamA.forEach(p => p.wins--); h.teamB.forEach(p => p.losses--) }
      else if (h.winner === 'B') { h.teamB.forEach(p => p.wins--); h.teamA.forEach(p => p.losses--) }

      if (newWinner === 'A') { h.teamA.forEach(p => { p.wins++; p.zone = 'win' }); h.teamB.forEach(p => { p.losses++; p.zone = 'lose' }) }
      else if (newWinner === 'B') { h.teamB.forEach(p => { p.wins++; p.zone = 'win' }); h.teamA.forEach(p => { p.losses++; p.zone = 'lose' }) }

      h.winner = newWinner
      renderAll()
      toast('✅ 已修正比賽結果')
    }

    // ═══════════════════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════════════════
    function renderAll() { renderChips(); renderPreview(); renderCourts(); renderLeaderboard(); renderHistory(); updateBtns(); saveState(); updateSessionBadge() }

    function updateBtns() {
      const max = Math.min(10, parseInt(document.getElementById('court-count').value) || 2)
      const onCourtIds = new Set(courts.flatMap(c => [...c.teamA, ...c.teamB].map(p => p.id)))
      const waiting = players.filter(p => !onCourtIds.has(p.id) && !p.excluded)
      const grpSz = gameMode === 'singles' ? 2 : 4
      document.getElementById('btn-shuffle').disabled = waiting.length < grpSz || (max - courts.length) <= 0
      document.getElementById('btn-release').disabled = preview.length === 0
    }

    function renderChips() {
      const onCourtIds = new Set(courts.flatMap(c => [...c.teamA, ...c.teamB].map(p => p.id)))
      const previewIds = new Set(preview.flatMap(m => [...m.teamA, ...m.teamB].map(p => p.id)))
      const waitingPlayers = players.filter(p => !onCourtIds.has(p.id))
      const restingCount = waitingPlayers.filter(p => p.excluded).length
      document.getElementById('pill-total').textContent = players.length + ' 人'
      document.getElementById('pill-wait').textContent = '等待 ' + waitingPlayers.length + (restingCount ? `（暫停 ${restingCount}）` : '')
      const el = document.getElementById('chip-list')
      if (!players.length) { el.innerHTML = '<span style="color:var(--muted);font-size:.82rem">尚無人報名</span>'; return }
      const zoneBg = { new: 'var(--green)', win: 'var(--green)', lose: 'var(--red)' }
      const zoneLabel = { new: '新', win: '贏', lose: '輸' }
      // 指定順序：顯示「第幾個點的」而不是內部的 pinOrder 原始值
      const pinRank = new Map(
        players.filter(p => p.pinOrder != null).sort((a, b) => a.pinOrder - b.pinOrder).map((p, idx) => [p.id, idx + 1])
      )
      el.innerHTML = players.map((p, i) => {
        const oc = onCourtIds.has(p.id), ip = previewIds.has(p.id)
        const isWaiting = !oc && !ip
        const cls = oc ? 'chip chip-court' : ip ? 'chip chip-preview' : (p.excluded ? 'chip chip-wait chip-excluded' : 'chip chip-wait')
        const rk_bg = oc ? '#7a8f9a' : ip ? '#c89020' : zoneBg[p.zone]
        let tag = oc ? `<span class="chip-tag tag-court">上場中</span>` : ip ? `<span class="chip-tag tag-prev">預覽中</span>` : ''
        if (isWaiting && p.pinOrder != null) tag += `<span class="chip-tag tag-pin">📌第${pinRank.get(p.id)}位</span>`
        if (isWaiting && p.excluded) tag += `<span class="chip-tag tag-pause">暫停</span>`
        const actionBtns = isWaiting
          ? `<button class="chip-pin${p.pinOrder != null ? ' active' : ''}" onclick="togglePin(${p.id})" title="依序點選＝指定隊友/對手順序">📌${p.pinOrder != null ? pinRank.get(p.id) : ''}</button>
             <button class="chip-pause${p.excluded ? ' active' : ''}" onclick="toggleExclude(${p.id})" title="${p.excluded ? '恢復上場' : '暫停上場'}">${p.excluded ? '▶' : '⏸'}</button>
             <button class="chip-del" onclick="removePlayer(${p.id})">✕</button>`
          : ''
        return `<div class="${cls}">
      <span class="chip-rk" style="background:${rk_bg}">${i + 1}</span>
      ${p.name}
      <span style="font-size:.58rem;opacity:.65">${zoneLabel[p.zone] || ''}</span>
      ${tag}
      ${actionBtns}
    </div>`
      }).join('')
    }

    function renderPreview() {
      const card = document.getElementById('preview-card')
      if (!preview.length) { card.style.display = 'none'; return }
      card.style.display = 'block'
      const onCourtIds = new Set(courts.flatMap(c => [...c.teamA, ...c.teamB].map(p => p.id)))
      const previewIds = new Set(preview.flatMap(m => [...m.teamA, ...m.teamB].map(p => p.id)))
      const leftover = players.filter(p => !onCourtIds.has(p.id) && !previewIds.has(p.id))
      document.getElementById('prev-list').innerHTML =
        preview.map(m => `<div class="prev-match">
      <span class="prev-court-lbl">場地 ${m.courtNum}</span>
      <div class="prev-team">${m.teamA.map(p => `<span class="prev-nm">${p.name}</span>`).join('')}</div>
      <span class="prev-vs">VS</span>
      <div class="prev-team">${m.teamB.map(p => `<span class="prev-nm">${p.name}</span>`).join('')}</div>
      <span class="prev-score" title="重複度：重複隊友(×2)+重複對手，越低越好">重複度 ${m.score}</span>
      <button class="prev-del" onclick="removePreviewMatch(${m.courtNum})" title="移除這場預覽（不影響統計）">✕</button>
    </div>`).join('') +
        (leftover.length ? `<div class="prev-left">等待下一輪：${leftover.map(p => p.name + (p.excluded ? '（暫停）' : '')).join('、')}</div>` : '')
    }

    // 移除單場預覽配對——尚未釋出上場，完全不影響上場次數/隊友對手紀錄/積分
    function removePreviewMatch(courtNum) {
      preview = preview.filter(m => m.courtNum !== courtNum)
      renderAll()
      toast('已移除該場預覽')
    }

    function renderCourts() {
      const grid = document.getElementById('courts-grid')
      document.getElementById('pill-courts').textContent = courts.length + ' 場'
      if (!courts.length) { grid.innerHTML = '<div class="empty">目前無上場隊伍</div>'; return }
      grid.innerHTML = courts.map(c => `<div class="cc">
    <div class="cc-head">
      <span class="cc-title">場地 ${c.courtNum}</span>
      <span class="cc-time">${fmt(c.startTime)}</span>
    </div>
    <div class="cc-teams">
      <div class="team-col">${c.teamA.map(p => `<div class="team-pl">${p.name}</div>`).join('')}</div>
      <span class="vs-div">VS</span>
      <div class="team-col">${c.teamB.map(p => `<div class="team-pl">${p.name}</div>`).join('')}</div>
    </div>
    <div class="cc-acts">
      <button class="btn-wa" onclick="recordResult(${c.id},'A')">🏆 ${c.teamA.map(p => p.name).join('&amp;')} 勝</button>
      <button class="btn-wb" onclick="recordResult(${c.id},'B')">🏆 ${c.teamB.map(p => p.name).join('&amp;')} 勝</button>
      <button class="btn-no" onclick="recordResult(${c.id},null)" title="不計分結束">✕</button>
    </div>
  </div>`).join('')
    }

    // 貝氏平均：個人勝率跟全體「中性基準」50% 依場次數加權混合，場次越少，
    // 分數越貼近50%；場次越多，越接近個人真實勝率。m=5 代表大約要打贏
    // 過5場虛擬的「基準對局」，個人紀錄的份量才會超過基準值一半。
    // 全體基準固定用 50%（不用動態計算目前所有人的平均），因為任何一場
    // 都是一勝一敗，長期本來就會趨近50%，用固定值可避免平均值被少數
    // 場次少的人拉動的循環問題。
    const BAYES_M = 5
    function bayesScore(wins, n) {
      if (n === 0) return 0.5
      return (n / (n + BAYES_M)) * (wins / n) + (BAYES_M / (n + BAYES_M)) * 0.5
    }

    function renderLeaderboard() {
      const el = document.getElementById('leaderboard')
      const onCourtIds = new Set(courts.flatMap(c => [...c.teamA, ...c.teamB].map(p => p.id)))
      const ranked = [...players].filter(p => p.matchCount > 0)
        .sort((a, b) => {
          const wa = bayesScore(a.wins, a.matchCount), wb = bayesScore(b.wins, b.matchCount)
          return wb - wa || (b.wins / b.matchCount) - (a.wins / a.matchCount) || b.matchCount - a.matchCount
        })
      if (!ranked.length) { el.innerHTML = '<div class="empty">尚無積分紀錄</div>'; return }
      // 場次基準：場上打最多場次的人的總場次 × 0.45，低於這個門檻的人
      // 積分旁會加註「場次過少，僅供參考」
      const lowSampleThreshold = Math.max(...ranked.map(p => p.matchCount)) * 0.45
      const sym = i => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)
      const rcls = i => i === 0 ? 'lbr g1' : i === 1 ? 'lbr g2' : i === 2 ? 'lbr g3' : 'lbr'
      el.innerHTML = `<div class="lb-hd">
    <span style="text-align:center">名次</span>
    <span>選手</span>
    <span style="text-align:center">勝</span>
    <span style="text-align:center">敗</span>
    <span style="text-align:center">場數</span>
    <span style="text-align:center">勝率</span>
    <span style="text-align:center" title="貝氏平均：個人勝率跟50%基準依場次加權混合，場次越少越貼近基準值">積分</span>
  </div>`+ ranked.map((p, i) => {
        const rate = p.matchCount > 0 ? Math.round(p.wins / p.matchCount * 100) : 0
        const score = Math.round(bayesScore(p.wins, p.matchCount) * 100)
        const barColor = rate >= 50 ? 'var(--green)' : 'var(--red)'
        const oc = onCourtIds.has(p.id)
        const lowSample = p.matchCount < lowSampleThreshold
        return `<div class="lb-row">
      <span class="${rcls(i)}">${sym(i)}</span>
      <span class="lbn"><span class="lbn-name">${p.name}</span>${oc ? '<span class="oc">上場中</span>' : ''}${lowSample ? '<span class="low-sample" title="場次過少，僅供參考">⚠️</span>' : ''}</span>
      <span class="lbw">${p.wins}</span>
      <span class="lbl">${p.losses}</span>
      <span class="lbt">${p.matchCount}</span>
      <span class="lbwr" style="color:${barColor}">${rate}%</span>
      <span class="lbscore">${score}</span>
    </div>`
      }).join('') +
        (ranked.some(p => p.matchCount < lowSampleThreshold) ? `<div class="lb-note">⚠️ 場次過少，僅供參考（低於全場最高場次的45%）</div>` : '')
    }

    function renderHistory() {
      const el = document.getElementById('hist-list')
      document.getElementById('pill-hist').textContent = history.length + ' 場'
      if (!history.length) { el.innerHTML = '<div class="empty">尚無記錄</div>'; return }
      el.innerHTML = history.map((h, i) => {
        const wA = h.winner === 'A', wB = h.winner === 'B'
        return `<div class="hi">
      <div class="hi-head">
        <span class="hi-court">場地 ${h.courtNum}</span>
        <span class="hi-time">${fmtF(h.startTime)} ～ ${fmt(h.endTime)}</span>
      </div>
      <div class="hi-match">
        <div class="hi-team">${h.teamA.map(p => `<span class="hi-nm${wA ? ' hi-win' : ''}">${p.name}</span>`).join('')}</div>
        <span class="hi-vs">VS</span>
        <div class="hi-team">${h.teamB.map(p => `<span class="hi-nm${wB ? ' hi-win' : ''}">${p.name}</span>`).join('')}</div>
        <span class="hi-res">${h.winner ? '🏆 ' + (h.winner === 'A' ? h.teamA : h.teamB).map(p => p.name).join(' & ') : '—'}</span>
      </div>
      ${i === 0 ? `<div class="hi-edit">
        <button class="btn-wa${wA ? ' hi-cur' : ''}" onclick="editResult(${h.id},'A')">${h.teamA.map(p => p.name).join('&amp;')} 勝</button>
        <button class="btn-wb${wB ? ' hi-cur' : ''}" onclick="editResult(${h.id},'B')">${h.teamB.map(p => p.name).join('&amp;')} 勝</button>
        <button class="btn-no${!h.winner ? ' hi-cur' : ''}" onclick="editResult(${h.id},null)" title="不計分">✕</button>
      </div>` : ''}
    </div>`
      }).join('')
    }

    // ═══════════════════════════════════════════════════════
    //  GITHUB 設定（硬碼，使用者看不到）
    // ═══════════════════════════════════════════════════════
    const GH_REPO = 'shinhuahlee/pickball_game'
    const GH_BRANCH = 'main'
    const GH_FOLDER = 'tournaments/'

    // ═══════════════════════════════════════════════════════
    //  AES-GCM 加解密（Web Crypto API）
    // ═══════════════════════════════════════════════════════
    async function deriveKey(password, salt) {
      const enc = new TextEncoder()
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey'])
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
        keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt'])
    }

    async function encryptToken(token, password) {
      const enc = new TextEncoder()
      const salt = crypto.getRandomValues(new Uint8Array(16))
      const iv = crypto.getRandomValues(new Uint8Array(12))
      const key = await deriveKey(password, salt)
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(token))
      // 組合 salt(16) + iv(12) + ciphertext → base64
      const buf = new Uint8Array(16 + 12 + ct.byteLength)
      buf.set(salt, 0); buf.set(iv, 16); buf.set(new Uint8Array(ct), 28)
      return btoa(String.fromCharCode(...buf))
    }

    async function decryptToken(b64, password) {
      const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0))
      const salt = buf.slice(0, 16)
      const iv = buf.slice(16, 28)
      const ct = buf.slice(28)
      const key = await deriveKey(password, salt)
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct)
      return new TextDecoder().decode(pt)
    }

    // ── logo 連點 5 下開管理員 ────────────────────────────────
    let _logoCnt = 0, _logoTimer = null
    function logoTap() {
      _logoCnt++
      clearTimeout(_logoTimer)
      _logoTimer = setTimeout(() => { _logoCnt = 0 }, 1500)
      if (_logoCnt >= 5) {
        _logoCnt = 0
        document.getElementById('adm-token').value = ''
        document.getElementById('adm-pw').value = ''
        document.getElementById('admin-modal').style.display = 'flex'
      }
    }

    async function adminSave() {
      const token = document.getElementById('adm-token').value.trim()
      const pw = document.getElementById('adm-pw').value
      if (!token || !pw) { alert('Token 和密碼都必須填寫'); return }
      if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
        if (!confirm('Token 格式看起來不對，確定要儲存？')) return
      }
      const encrypted = await encryptToken(token, pw)
      localStorage.setItem('pb_token_enc', encrypted)
      document.getElementById('admin-modal').style.display = 'none'
      document.getElementById('adm-token').value = ''
      document.getElementById('adm-pw').value = ''
      toast('✅ Token 已加密儲存，之後推送時輸入密碼即可')
    }

    // ═══════════════════════════════════════════════════════
    //  PUSH TO GITHUB
    // ═══════════════════════════════════════════════════════
    function pushToGitHub() {
      const enc = localStorage.getItem('pb_token_enc')
      if (!enc) {
        toast('⚙️管理員設定') // '⚙️ 請先點 logo 5 下設定推送 Token'
        return
      }
      document.getElementById('push-pw').value = ''
      document.getElementById('pw-err').style.display = 'none'
      document.getElementById('pw-modal').style.display = 'flex'
      setTimeout(() => document.getElementById('push-pw').focus(), 100)
    }

    async function confirmPush() {
      const pw = document.getElementById('push-pw').value
      const enc = localStorage.getItem('pb_token_enc')
      const errEl = document.getElementById('pw-err')
      let token
      try {
        token = await decryptToken(enc, pw)
      } catch {
        errEl.style.display = 'block'
        document.getElementById('push-pw').value = ''
        document.getElementById('push-pw').focus()
        return
      }
      errEl.style.display = 'none'
      document.getElementById('pw-modal').style.display = 'none'

      const btn = document.getElementById('btn-gh')
      btn.textContent = '⏳ 推送中…'
      btn.disabled = true

      try {
        const csvContent = buildCSVContent()
        const filePath = GH_FOLDER + `pickleball_${sessionId}.csv`
        const apiUrl = `https://api.github.com/repos/${GH_REPO}/contents/${filePath}`
        const headers = { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' }

        let sha = null
        const getRes = await fetch(apiUrl, { headers })
        if (getRes.ok) sha = (await getRes.json()).sha

        const body = {
          message: `比賽記錄 ${sessionId}`,
          content: btoa(unescape(encodeURIComponent(csvContent))),
          branch: GH_BRANCH,
        }
        if (sha) body.sha = sha

        const putRes = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) })
        if (!putRes.ok) {
          const err = await putRes.json()
          throw new Error(err.message || putRes.status)
        }
        toast(`✅ 已推送到 GitHub！${sha ? '（更新）' : '（新建）'}`)
      } catch (e) {
        toast('❌ 推送失敗：' + e.message)
      } finally {
        btn.textContent = '☁️ 推送GitHub'
        btn.disabled = false
      }
    }

    // 抽出 CSV 內容（exportCSV 和 pushToGitHub 共用）
    function buildCSVContent() {
      const rows = [['比賽代號', sessionId], ['開始時間', sessionStart], ['匯出時間', fmtF(now())], []]
      rows.push(['─── 積分排行榜 ───'])
      rows.push(['名次', '選手', '勝', '敗', '場數', '勝率', '積分', '備註'])
      const ranked = [...players].filter(p => p.matchCount > 0)
        .sort((a, b) => {
          const wa = bayesScore(a.wins, a.matchCount), wb = bayesScore(b.wins, b.matchCount)
          return wb - wa || (b.wins / b.matchCount) - (a.wins / a.matchCount) || b.matchCount - a.matchCount
        })
      const lowSampleThreshold = Math.max(...ranked.map(p => p.matchCount)) * 0.45
      ranked.forEach((p, i) => {
        const rate = p.matchCount ? Math.round(p.wins / p.matchCount * 100) : 0
        const score = Math.round(bayesScore(p.wins, p.matchCount) * 100)
        rows.push([i + 1, p.name, p.wins, p.losses, p.matchCount, rate + '%', score, p.matchCount < lowSampleThreshold ? '場次過少，僅供參考' : ''])
      })
      rows.push([])
      rows.push(['─── 比賽歷史記錄 ───'])
      rows.push(['場次', '場地', '隊A選手1', '隊A選手2', '隊B選手1', '隊B選手2', '勝隊', '開始時間', '結束時間'])
        ;[...history].reverse().forEach((h, i) => {
          const wLabel = h.winner === 'A' ? h.teamA.map(p => p.name).join('+')
            : h.winner === 'B' ? h.teamB.map(p => p.name).join('+') : '—'
          rows.push([i + 1, h.courtNum,
          h.teamA[0]?.name || '', h.teamA[1]?.name || '',
          h.teamB[0]?.name || '', h.teamB[1]?.name || '',
            wLabel,
          h.startTime ? fmtF(h.startTime) : '',
          h.endTime ? fmtF(h.endTime) : ''])
        })
      if (courts.length) {
        rows.push([])
        rows.push(['─── 進行中（尚未結束）───'])
        rows.push(['場地', '隊A選手1', '隊A選手2', '隊B選手1', '隊B選手2', '開始時間'])
        courts.forEach(c => rows.push([c.courtNum,
        c.teamA[0]?.name || '', c.teamA[1]?.name || '',
        c.teamB[0]?.name || '', c.teamB[1]?.name || '',
        c.startTime ? fmtF(c.startTime) : '']))
      }
      return '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n')
    }

    // ── 初始化：嘗試還原上次記錄 ──────────────────────────────────
    const restored = loadState()
    if (!restored) {
      sessionId = genId()
      sessionStart = fmtF(now())
    }
    renderAll()
    if (restored) toast(`🔄 已還原上次比賽記錄（${history.length} 場歷史）`)
  </script>
</body>
